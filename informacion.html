<!doctype html>

<head>

<meta name="robots" content="noindex,follow">
<title>Información | PremiumGol</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--gold:#F7C85D;--light:#e8eff8;--muted:#adbed1}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:linear-gradient(145deg,#070e1b,#111f34);color:var(--light);font:14px 'DM Sans',sans-serif}
header{border-bottom:1px solid #34435b;background:#091323}header .inner{width:min(860px,calc(100% - 32px));margin:auto;padding:18px 0;display:flex;align-items:center;justify-content:space-between;gap:16px}
header img{width:min(220px,56vw);height:auto}a{color:var(--gold);text-underline-offset:3px}
.back{white-space:nowrap;color:#f8fbff;font-size:12px;text-decoration:none;border:1px solid #53637b;border-radius:9px;padding:10px 12px}
main{width:min(750px,calc(100% - 32px));margin:clamp(32px,7vw,75px) auto}
.card{background:#13233a;border:1px solid #35495f;border-radius:18px;padding:clamp(20px,5vw,36px);box-shadow:0 18px 50px #0005}
.eyebrow{display:block;color:var(--gold);font-size:10px;letter-spacing:.17em;font-weight:900;text-transform:uppercase;margin-bottom:12px}
h1{font:850 clamp(25px,5vw,34px)/1.2 Outfit,sans-serif;margin:0 0 18px}
p{font-size:14px;color:#d1ddea;line-height:1.75;margin:0 0 21px}
.status{display:inline-flex;border:1px solid #F7C85D66;border-radius:99px;padding:7px 10px;font-size:10px;color:#f3dba3;background:#F7C85D0c;font-weight:800;margin-bottom:20px}
.links{display:flex;flex-wrap:wrap;gap:9px}.links a{display:inline-block;border:1px solid #66778f;border-radius:9px;padding:10px 13px;text-decoration:none;font-size:12px;font-weight:700}
footer{text-align:center;color:var(--muted);font-size:11px;padding:25px 15px 40px}
@media(max-width:420px){header .inner{gap:8px}.back{font-size:10px;padding:8px}}
</style>
</head>
<body>
<header><div class="inner"><a href="./#inicio" aria-label="Volver a PremiumGol"><img src="assets/premiumgol-logo-oficial.png" width="1224" height="228" alt="PremiumGol"></a><a class="back" href="./#inicio">Volver al inicio</a></div></header>
<main><article class="card">
<span class="eyebrow">PremiumGol · Información</span>
<h1 id="topicTitle">Información de PremiumGol</h1>
<span class="status" id="topicStatus">Información en preparación</span>
<p id="topicBody">Selecciona una sección desde el pie de página de PremiumGol.</p>
<div class="links"><a href="./#inicio">Ir a PremiumGol</a><a href="./#gol">Ver PremiumGol</a></div>
</article></main>
<footer>Una experiencia de PremiumLott · Sitio dirigido a mayores de 18 años.</footer>
<script>
'use strict';
const topics={"quienes-somos":["¿Quiénes somos?","PremiumGol es una experiencia digital de PremiumLott dedicada al fútbol, los pronósticos y el entretenimiento deportivo. La información institucional completa se publicará en esta sección."],"responsabilidad-social":["Responsabilidad social","Este apartado está reservado para los compromisos e iniciativas verificables de responsabilidad social de PremiumGol. Su contenido oficial se encuentra en preparación."],"politica-datos-personales":["Política de Datos Personales","El documento completo de tratamiento de datos personales de PremiumGol está pendiente de revisión y publicación. Este texto informativo no sustituye una política de privacidad oficial."],"politica-cookies":["Política de Cookies","PremiumGol cuenta con un panel para aceptar o rechazar herramientas opcionales de medición cuando estas se encuentran configuradas. El documento específico de cookies está pendiente de publicación. Puedes revisar tus preferencias desde el enlace del pie de página de PremiumGol."],"trabaja-con-nosotros":["Trabaja con nosotros","Esta sección está en preparación. No hay un proceso de contratación abierto anunciado desde este apartado."],"terminos-y-condiciones":["Términos y Condiciones","Los términos y condiciones generales oficiales se encuentran pendientes de revisión y publicación. Las reglas de cada juego deben consultarse en su sección correspondiente. Este aviso no representa un contrato ni condiciones definitivas."],"centro-de-ayuda":["Centro de Ayuda","Estamos preparando la información de ayuda y asistencia para usuarios de PremiumGol. Mientras tanto, puedes consultar las opciones disponibles dentro de tu cuenta."],"juego-responsable":["Juego responsable","El acceso es exclusivo para mayores de 18 años. Fija límites de tiempo y gasto; no utilices dinero destinado a necesidades esenciales y no intentes recuperar pérdidas. Si el juego afecta tu bienestar, interrumpe tu participación y busca ayuda profesional. Las opciones formales de asistencia y autoexclusión se publicarán cuando estén disponibles."],"reglamentos":["Reglamentos","Los reglamentos oficiales se publicarán por juego. Puedes consultar las reglas disponibles en la sección PremiumGol, mediante el botón «Ver reglas y condiciones». No deben suponerse premios o condiciones distintas de las comunicadas expresamente."],"autocontrol":["Autocontrol","Es importante establecer límites personales antes de participar en cualquier juego. La información sobre funciones específicas de autocontrol, pausas o autoexclusión de PremiumGol está pendiente de publicación; este apartado no implica que ya existan herramientas automatizadas."],"registro-personas-prohibidas":["Registro de personas prohibidas","La información y el procedimiento oficial aplicables a las restricciones de participación se incorporarán cuando estén definidos. Este apartado no constituye un registro ni un mecanismo de consulta de personas excluidas."],"persona-politicamente-expuesta":["Persona políticamente expuesta","Este apartado está reservado para la información relativa a controles y declaraciones exigibles, si corresponden. El procedimiento formal se encuentra pendiente de publicación."],"preguntas-frecuentes":["Preguntas frecuentes","Estamos preparando respuestas oficiales sobre cuenta, acceso, recargas, bonos y funcionamiento de los juegos. Este apartado será actualizado antes de habilitarlo como centro de consultas."],"contacto":["Contáctanos","La página de contacto oficial de PremiumGol está en preparación. Puedes consultar los perfiles sociales que figuran en el pie de página principal. No compartas documentos, contraseñas o códigos de acceso en publicaciones públicas."],"las-fijas":["Las Fijas · WhatsApp","El canal oficial de WhatsApp de PremiumGol todavía no ha sido vinculado. Cuando exista un enlace verificado se añadirá aquí. No redirigimos al canal de otra plataforma."],"libro-reclamaciones":["Libro de Reclamaciones","El formulario digital oficial de reclamaciones de PremiumGol está pendiente de implementación y publicación. Esta página es únicamente informativa: no permite registrar reclamos y no equivale a un Libro de Reclamaciones electrónico habilitado."]};
function renderTopic(){
  const key=decodeURIComponent(location.hash.slice(1));
  const data=Object.prototype.hasOwnProperty.call(topics,key)?topics[key]:['Información de PremiumGol','El contenido de esta sección todavía no está disponible.'];
  document.getElementById('topicTitle').textContent=data[0];
  document.getElementById('topicBody').textContent=data[1];
  document.title=data[0]+' | PremiumGol';
}
window.addEventListener('hashchange',renderTopic);
renderTopic();
</script>
</body>
</html>
